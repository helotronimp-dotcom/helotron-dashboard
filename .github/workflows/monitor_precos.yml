name: Monitor de Precos ML

on:
  # Agendamento desativado em 11/06/2026 — API do ML bloqueia IPs do GitHub Actions (AWS)
  # Reativar após conta ML ter OAuth liberado (após primeiras vendas)
  # schedule:
  #   - cron: '0 11 */2 * *'  # A cada 2 dias às 08:00 horário de Brasília (11:00 UTC)
  workflow_dispatch:          # Mantido para testes manuais via GitHub

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar monitor de preços
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python monitor_precos_cloud.py
